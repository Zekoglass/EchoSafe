name: echosafe
description: Smart Fake Call & Emergency Exit Planner Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.3
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  vibration: ^2.0.0
  sensors_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/